name: GTA6 Viral Clipper

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Optional: Single YouTube URL (leave blank to run 8-creator live radar)'
        required: false
        default: ''
      top_clips:
        description: 'Max clips to render (1 for hourly live radar, 1-3 for single URL)'
        required: false
        default: '1'
      listen_sec:
        description: 'Live chat listen duration in seconds (default 180s = 3 min for quick manual test)'
        required: false
        default: '180'

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode YouTube cookies & Google Drive token
        env:
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
          GDRIVE_TOKEN_B64: ${{ secrets.GDRIVE_TOKEN_B64 }}
        run: |
          if [ -n "$YT_COOKIES_B64" ]; then
            echo "$YT_COOKIES_B64" | base64 -d > cookies.txt
          fi
          if [ -n "$GDRIVE_TOKEN_B64" ]; then
            echo "$GDRIVE_TOKEN_B64" | base64 -d > token.json
          fi

      - name: Run Live Radar or Single URL Clipper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          TOP_CLIPS: ${{ github.event.inputs.top_clips || '1' }}
          LISTEN_SEC: ${{ github.event.inputs.listen_sec || '1800' }}
        run: |
          if [ -n "$VIDEO_URL" ]; then
            echo "Running single URL mode ($LISTEN_SEC s): $VIDEO_URL"
            python live_chat_watcher.py "$VIDEO_URL" --listen "$LISTEN_SEC" --top "$TOP_CLIPS"
          else
            echo "Running 8-creator live radar ($LISTEN_SEC s capture, top 1 viral clip only)"
            python watch_list.py --listen "$LISTEN_SEC" --top 1 --max-creators 2
          fi