name: GTA6 Viral Clipper

on:
  schedule:
    # Runs automatically once every hour at minute :15 (e.g., 2:15, 3:15, 4:15)
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Optional YouTube Live or VOD URL (leave blank to scan all 8 creators)'
        required: false
        default: ''
      top_clips:
        description: 'Max Shorts to generate'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (for yt-dlp)
        uses: denoland/setup-deno@v2

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-color-emoji
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore secrets and auth files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          if [ -n "$YT_COOKIES_B64" ]; then
            echo "$YT_COOKIES_B64" | base64 -d > cookies.txt
          fi

      - name: Run Live Radar or Single URL Clipper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_TOKEN_B64: ${{ secrets.GDRIVE_TOKEN_B64 }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          TOP_CLIPS: ${{ github.event.inputs.top_clips || '1' }}
        run: |
          if [ -n "$VIDEO_URL" ]; then
            echo "Running single URL mode: $VIDEO_URL"
            python live_chat_watcher.py "$VIDEO_URL" --listen 1800 --top "$TOP_CLIPS"
          else
            echo "Running 8-creator live radar (30-min capture, top 1 viral clip only)"
            python watch_list.py --listen 1800 --top 1 --max-creators 2
          fi