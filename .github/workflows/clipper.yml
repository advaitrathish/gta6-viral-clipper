name: GTA6 Viral Clipper

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Video Source Mode'
        type: choice
        required: true
        default: 'auto'
        options:
          - auto
          - live
          - vod_replay
          - upload
          - radar
      video_url:
        description: 'YouTube URL (leave blank if mode is radar)'
        type: string
        required: false
        default: ''
      min_clips:
        description: 'Minimum clips to guarantee (1-3)'
        type: string
        required: false
        default: '1'
      max_clips:
        description: 'Maximum clips to render (1-5)'
        type: string
        required: false
        default: '2'
      listen_sec:
        description: 'Live chat listen seconds (ONLY used for live/radar; ignored for vod_replay/upload)'
        type: string
        required: false
        default: '1800'

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Deno (for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system & Python dependencies
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true update -qq
          sudo apt-get -o Acquire::ForceIPv4=true install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt

      - name: Decode YouTube cookies & Google Drive token
        env:
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
          GDRIVE_TOKEN_B64: ${{ secrets.GDRIVE_TOKEN_B64 }}
        run: |
          if [ -n "$YT_COOKIES_B64" ]; then
            echo "$YT_COOKIES_B64" | base64 -d > cookies.txt
          fi
          if [ -n "$GDRIVE_TOKEN_B64" ]; then
            echo "$GDRIVE_TOKEN_B64" | base64 -d > token.json
          fi

      - name: Run Clipper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_TOKEN_B64: ${{ secrets.GDRIVE_TOKEN_B64 }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          MODE: ${{ github.event.inputs.mode || 'radar' }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          MIN_CLIPS: ${{ github.event.inputs.min_clips || '1' }}
          MAX_CLIPS: ${{ github.event.inputs.max_clips || '2' }}
          LISTEN_SEC: ${{ github.event.inputs.listen_sec || '1800' }}
        run: |
          if [ "$MODE" = "radar" ] || [ -z "$VIDEO_URL" ]; then
            echo "Running 8-creator live radar ($LISTEN_SEC s capture, top 1 viral clip only)"
            python watch_list.py --listen "$LISTEN_SEC" --top 1 --max-creators 2
          else
            echo "Running single URL mode [$MODE] (min=$MIN_CLIPS, max=$MAX_CLIPS): $VIDEO_URL"
            python live_chat_watcher.py "$VIDEO_URL" --mode "$MODE" --listen "$LISTEN_SEC" --min-clips "$MIN_CLIPS" --max-clips "$MAX_CLIPS"
          fi